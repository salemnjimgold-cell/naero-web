<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Glow/Aura -->
  <circle cx="256" cy="256" r="240" fill="url(#paint0_radial)" fill-opacity="0.15"/>
  
  <!-- Robot Head Base -->
  <rect x="128" y="160" width="256" height="200" rx="60" fill="white" shadow="0 10 20 rgba(0,0,0,0.1)"/>
  <rect x="128" y="160" width="256" height="200" rx="60" stroke="url(#paint1_linear)" stroke-width="8"/>
  
  <!-- Visor -->
  <rect x="160" y="200" width="192" height="80" rx="30" fill="#1E293B"/>
  
  <!-- Eyes (Glowing) -->
  <circle cx="200" cy="240" r="15" fill="#00E5FF">
    <animate attributeName="opacity" values="1;0.6;1" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="312" cy="240" r="15" fill="#00E5FF">
    <animate attributeName="opacity" values="1;0.6;1" dur="3s" repeatCount="indefinite" />
  </circle>
  
  <!-- Antennas -->
  <path d="M180 160L160 120" stroke="url(#paint1_linear)" stroke-width="12" stroke-linecap="round"/>
  <path d="M332 160L352 120" stroke="url(#paint1_linear)" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Text: Naero -->
  <text x="256" y="440" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#paint1_linear)" text-anchor="middle">Naero</text>
  <text x="256" y="440" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#paint1_linear)" text-anchor="middle" filter="url(#glow)">Naero</text>

  <defs>
    <radialGradient id="paint0_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 256) rotate(90) scale(240)">
      <stop stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paint1_linear" x1="128" y1="160" x2="384" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
</svg>
